version: '3'

dotenv: ['.env']

tasks:
  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:integration:
    desc: Integration tests against a throwaway Postgres (needs Docker)
    vars:
      PG_URL: postgres://postgres:test@127.0.0.1:55432/kehrwoche?sslmode=disable
    cmds:
      - docker run -d --rm --name kw-pgtest -e POSTGRES_PASSWORD=test -e POSTGRES_DB=kehrwoche -p 55432:5432 postgres:17-alpine
      - defer: docker stop kw-pgtest
      - for i in $(seq 1 30); do docker exec kw-pgtest pg_isready -U postgres -d kehrwoche -q && break || sleep 0.5; done
      - TEST_DATABASE_URL='{{.PG_URL}}' go test -tags=integration -p 1 -count=1 ./...

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  mcp:
    desc: Run the MCP server (started by an MCP client over stdio, not by hand)
    silent: true
    cmds:
      - go run ./cmd/mcp

  tidy:
    desc: Tidy go.mod/go.sum
    sources:
      - go.mod
      - go.sum
      - '**/*.go'
    cmds:
      - go mod tidy

  migrate:
    desc: Run database migrations
    sources:
      - migrations/**/*.sql
      - cmd/migrate/**/*.go
    cmds:
      - go run ./cmd/migrate

  seed:
    desc: 'Seed / regenerate the schedule — pass flags after `--`, e.g. task seed -- -dry'
    cmds:
      - go run ./cmd/seed {{.CLI_ARGS}}
